<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>El Sermón del Monte · Preguntas</title>
<style>
  /* ============================================================
     ESTILOS
     ============================================================ */
  :root {
    --bg: #0a0f1c;
    --bg-2: #111a2e;
    --panel: #141e33;
    --panel-2: #1b2742;
    --line: #2a3a5c;
    --text: #f5f7fb;
    --muted: #9aa8c4;
    --dim: #5d6b88;
    --used: #2b7a4b;
    --accent: #f5c451;          /* cambia según la sección */
    --accent-ink: #1a1405;
  }
  body[data-section="multipleChoice"] { --accent: #f5c451; --accent-ink: #1f1703; }
  body[data-section="fillBlank"]      { --accent: #4fd1c5; --accent-ink: #032220; }
  body[data-section="analysis"]       { --accent: #b49cff; --accent-ink: #160d33; }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Roboto, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* ---------- Layout del modo control ---------- */
  .app {
    height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr;
  }
  .topbar {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--line);
    background: var(--bg-2);
  }
  .brand { font-weight: 700; font-size: 18px; letter-spacing: .02em; white-space: nowrap; }
  .brand small { color: var(--muted); font-weight: 500; margin-left: 8px; }
  .topbar .spacer { flex: 1; }

  .main {
    min-height: 0;
    display: grid;
    grid-template-columns: 400px 1fr;
  }
  .panel {
    min-height: 0;
    overflow-y: auto;
    padding: 18px;
    border-right: 1px solid var(--line);
    background: var(--panel);
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .panel h2 {
    margin: 0 0 8px;
    font-size: 12px;
    letter-spacing: .14em;
    color: var(--muted);
    font-weight: 700;
  }

  /* Pestañas de sección */
  .sections { display: grid; gap: 8px; }
  .sec-btn {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 14px;
    border-radius: 10px;
    border: 2px solid var(--line);
    background: var(--panel-2);
    font-size: 16px; font-weight: 600; text-align: left;
  }
  .sec-btn .count { font-size: 13px; color: var(--muted); font-weight: 500; }
  .sec-btn[data-key="multipleChoice"] { --c: #f5c451; }
  .sec-btn[data-key="fillBlank"]      { --c: #4fd1c5; }
  .sec-btn[data-key="analysis"]       { --c: #b49cff; }
  .sec-btn:hover { border-color: var(--c); }
  .sec-btn[aria-pressed="true"] { border-color: var(--c); background: color-mix(in srgb, var(--c) 18%, var(--panel-2)); }
  .sec-btn[aria-pressed="true"] .name { color: var(--c); }

  /* Cuadrícula de preguntas */
  .grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }
  .cell { position: relative; }
  .num {
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 10px;
    border: 2px solid var(--line);
    background: var(--panel-2);
    font-size: 20px; font-weight: 700;
    display: grid; place-items: center;
  }
  .num:hover { border-color: var(--accent); }
  .cell.used .num {
    background: color-mix(in srgb, var(--used) 22%, var(--panel));
    border-color: color-mix(in srgb, var(--used) 60%, var(--line));
    color: var(--muted);
    text-decoration: line-through;
    text-decoration-thickness: 2px;
  }
  .cell.current .num {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
    text-decoration: none;
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent);
  }
  .chk {
    position: absolute; top: -6px; right: -6px;
    width: 24px; height: 24px;
    border-radius: 50%;
    border: 2px solid var(--line);
    background: var(--bg);
    color: transparent;
    font-size: 13px; font-weight: 900; line-height: 1;
    display: grid; place-items: center;
    padding: 0;
    opacity: .55;
  }
  .cell:hover .chk, .chk:focus-visible { opacity: 1; color: var(--muted); }
  .cell.used .chk { opacity: 1; background: var(--used); border-color: var(--used); color: #fff; }

  .progress { font-size: 13px; color: var(--muted); margin-top: 10px; }

  /* Botones de acción */
  .actions { display: grid; gap: 8px; }
  .btn {
    padding: 12px 14px;
    border-radius: 10px;
    border: 2px solid var(--line);
    background: var(--panel-2);
    font-size: 15px; font-weight: 700; letter-spacing: .04em;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.primary {
    background: var(--accent); border-color: var(--accent); color: var(--accent-ink);
    font-size: 18px; padding: 14px;
  }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.danger { color: #ff9a9a; }
  .btn.danger:hover { border-color: #ff6b6b; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  .help { font-size: 12.5px; color: var(--muted); line-height: 1.7; }
  .help kbd {
    display: inline-block; min-width: 22px; text-align: center;
    padding: 1px 6px; border-radius: 5px;
    border: 1px solid var(--line); background: var(--bg);
    color: var(--text); font-family: inherit; font-size: 12px;
  }

  /* ---------- Escenario (pregunta) ---------- */
  .stage-wrap {
    min-height: 0;
    padding: 20px;
    display: flex;
  }
  .stage {
    position: relative;
    flex: 1;
    min-height: 0;
    border-radius: 16px;
    background:
      radial-gradient(ellipse at 50% 0%, color-mix(in srgb, var(--accent) 7%, transparent), transparent 60%),
      var(--bg);
    border: 1px solid var(--line);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4% 5%;
  }
  .content {
    width: 100%;
    max-width: 28em;
    line-height: 1.25;
  }
  .content.enter { animation: fadeIn .18s ease-out; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .q-label {
    font-size: .42em;
    font-weight: 800;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: .5em;
  }
  .q-ref {
    display: inline-block;
    font-size: .42em;
    font-weight: 600;
    color: var(--muted);
    border: .08em solid var(--line);
    border-radius: 2em;
    padding: .2em .8em;
    margin-bottom: 1.1em;
  }
  .q-text {
    font-size: 1em;
    font-weight: 650;
    margin: 0;
    text-wrap: pretty;
  }
  .q-text.phrase { font-weight: 550; line-height: 1.45; }
  .q-text.analysis { font-size: 1.08em; }
  .blank {
    display: inline-block;
    width: 4.6em;
    height: 1em;
    border-bottom: .1em solid var(--accent);
    margin: 0 .12em;
    vertical-align: -.12em;
  }
  .options {
    list-style: none;
    margin: 1em 0 0;
    padding: 0;
    display: grid;
    gap: .36em;
    font-size: .68em;
  }
  .options li {
    display: flex;
    align-items: baseline;
    gap: .6em;
    padding: .38em .6em;
    border-radius: .35em;
    background: color-mix(in srgb, var(--text) 5%, transparent);
    border: .04em solid color-mix(in srgb, var(--text) 10%, transparent);
    font-weight: 500;
  }
  .options .letter {
    flex: none;
    width: 1.6em;
    height: 1.6em;
    border-radius: 50%;
    display: inline-grid;
    place-items: center;
    font-weight: 800;
    font-size: .9em;
    background: color-mix(in srgb, var(--text) 12%, transparent);
    transform: translateY(.18em);
  }

  /* Controles flotantes del modo presentación */
  .pres-controls {
    position: fixed;
    right: 18px; bottom: 16px;
    display: none;
    gap: 8px;
    opacity: .18;
    transition: opacity .25s;
    z-index: 10;
  }
  .pres-controls:hover, body.mouse-active .pres-controls { opacity: .85; }
  .pres-controls button {
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--panel);
    font-size: 14px; font-weight: 600;
  }
  .digit-hint {
    position: fixed; left: 50%; top: 18px; transform: translateX(-50%);
    padding: 8px 16px; border-radius: 10px;
    background: var(--panel); border: 1px solid var(--accent);
    color: var(--accent); font-weight: 700; font-size: 18px;
    display: none; z-index: 11;
  }
  .digit-hint.show { display: block; }

  /* ---------- MODO PRESENTACIÓN ---------- */
  body.presenting .topbar,
  body.presenting .panel { display: none; }
  body.presenting .app { grid-template-rows: 1fr; }
  body.presenting .main { grid-template-columns: 1fr; }
  body.presenting .stage-wrap { padding: 0; }
  body.presenting .stage { border: 0; border-radius: 0; padding: 3.5vh 5vw; }
  body.presenting .pres-controls { display: flex; }
  body.presenting.hide-cursor, body.presenting.hide-cursor * { cursor: none; }

  /* ---------- Responsive (laptop pequeña / iPad / móvil) ---------- */
  @media (max-width: 980px) {
    body:not(.presenting) { overflow: auto; }
    body:not(.presenting) .app { height: auto; min-height: 100vh; }
    body:not(.presenting) .main { grid-template-columns: 1fr; }
    body:not(.presenting) .panel { border-right: 0; border-bottom: 1px solid var(--line); overflow: visible; }
    body:not(.presenting) .stage-wrap { height: 62vh; padding: 12px; }
    .brand small { display: none; }
    .num { aspect-ratio: auto; height: 56px; }
  }
</style>
</head>
<body data-section="multipleChoice">

<div class="app">
  <header class="topbar">
    <div class="brand">El Sermón del Monte <small>Mateo 5-7 · Nueva Traducción Viviente</small></div>
    <div class="spacer"></div>
    <button class="btn" id="btnFullscreen" type="button">PANTALLA COMPLETA</button>
  </header>

  <div class="main">
    <aside class="panel">
      <section>
        <h2>SECCIÓN</h2>
        <div class="sections" id="sections"></div>
      </section>

      <section>
        <h2>PREGUNTA</h2>
        <div class="grid" id="grid"></div>
        <div class="progress" id="progress"></div>
      </section>

      <section class="actions">
        <button class="btn primary" id="btnPresent" type="button">▶ PRESENTAR</button>
        <button class="btn" id="btnRandom" type="button">🎲 PREGUNTA ALEATORIA</button>
        <div class="row">
          <button class="btn" id="btnPrev" type="button">◀ ANTERIOR</button>
          <button class="btn" id="btnNext" type="button">SIGUIENTE ▶</button>
        </div>
        <button class="btn" id="btnUsed" type="button">✓ MARCAR COMO USADA</button>
        <button class="btn danger" id="btnReset" type="button">REINICIAR PROGRESO</button>
      </section>

      <section class="help">
        <h2>TECLADO</h2>
        <kbd>→</kbd> / <kbd>←</kbd> siguiente / anterior<br>
        <kbd>1</kbd>–<kbd>24</kbd> ir a una pregunta<br>
        <kbd>P</kbd> o <kbd>Enter</kbd> presentar<br>
        <kbd>Esc</kbd> o <kbd>S</kbd> volver al selector<br>
        <kbd>F</kbd> pantalla completa<br>
        <kbd>R</kbd> pregunta aleatoria<br>
        <kbd>U</kbd> marcar / desmarcar como usada
      </section>
    </aside>

    <div class="stage-wrap">
      <div class="stage" id="stage">
        <div class="content" id="content"></div>
      </div>
    </div>
  </div>
</div>

<div class="pres-controls" id="presControls">
  <button type="button" id="pPrev">◀</button>
  <button type="button" id="pNext">▶</button>
  <button type="button" id="pFull">⛶</button>
  <button type="button" id="pExit">✕ Selector (Esc)</button>
</div>
<div class="digit-hint" id="digitHint"></div>

/* ============================================================
   CONFIGURACIÓN
   ============================================================ */
const SECTIONS = {
  multipleChoice: { name: "Selección múltiple", label: "SELECCIÓN MÚLTIPLE" },
  fillBlank:      { name: "Completa la frase",  label: "COMPLETA LA FRASE" },
  analysis:       { name: "Análisis",           label: "ANÁLISIS" }
};
const SECTION_KEYS = Object.keys(SECTIONS);
const LETTERS = ["A", "B", "C", "D"];
const STORAGE_KEY = "sermon-monte-participante-v1";

/* ============================================================
   ESTADO
   ============================================================ */
const state = {
  section: "multipleChoice",
  index: { multipleChoice: 0, fillBlank: 0, analysis: 0 },
  used:  { multipleChoice: [], fillBlank: [], analysis: [] },
  presenting: false
};

function save() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      section: state.section, index: state.index, used: state.used
    }));
  } catch (e) { /* almacenamiento no disponible: se ignora */ }
}
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
    if (!s) return;
    if (SECTIONS[s.section]) state.section = s.section;
    for (const k of SECTION_KEYS) {
      const n = questions[k].length;
      if (s.index && Number.isInteger(s.index[k]) && s.index[k] >= 0 && s.index[k] < n) state.index[k] = s.index[k];
      if (s.used && Array.isArray(s.used[k])) state.used[k] = s.used[k].filter(x => Number.isInteger(x) && x >= 1 && x <= n);
    }
  } catch (e) { /* datos corruptos o sin acceso: se ignora */ }
}

const list = () => questions[state.section];
const current = () => list()[state.index[state.section]];
const isUsed = (sec, num) => state.used[sec].includes(num);

/* ============================================================
   ELEMENTOS
   ============================================================ */
const $ = id => document.getElementById(id);
const els = {
  sections: $("sections"), grid: $("grid"), progress: $("progress"),
  stage: $("stage"), content: $("content"), btnUsed: $("btnUsed"),
  digitHint: $("digitHint")
};

/* ============================================================
   RENDER
   ============================================================ */
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

function renderSections() {
  els.sections.innerHTML = "";
  for (const k of SECTION_KEYS) {
    const b = el("button", "sec-btn");
    b.type = "button";
    b.dataset.key = k;
    b.setAttribute("aria-pressed", String(k === state.section));
    b.append(el("span", "name", SECTIONS[k].name));
    b.append(el("span", "count", `${state.used[k].length}/${questions[k].length} usadas`));
    b.addEventListener("click", () => setSection(k));
    els.sections.append(b);
  }
}

function renderGrid() {
  els.grid.innerHTML = "";
  const sec = state.section;
  list().forEach((q, i) => {
    const cell = el("div", "cell");
    if (isUsed(sec, q.number)) cell.classList.add("used");
    if (i === state.index[sec]) cell.classList.add("current");

    const num = el("button", "num", String(q.number));
    num.type = "button";
    num.setAttribute("aria-label", `Pregunta ${q.number}`);
    num.addEventListener("click", () => go(i));

    const chk = el("button", "chk", "✓");
    chk.type = "button";
    chk.setAttribute("aria-label", `Marcar pregunta ${q.number} como usada`);
    chk.addEventListener("click", e => { e.stopPropagation(); toggleUsed(q.number); });

    cell.append(num, chk);
    els.grid.append(cell);
  });
  const n = state.used[sec].length;
  els.progress.textContent = `Usadas: ${n} de ${list().length}`;
  els.btnUsed.textContent = isUsed(sec, current().number) ? "↺ MARCAR COMO NO USADA" : "✓ MARCAR COMO USADA";
}

function renderQuestion() {
  const sec = state.section;
  const q = current();
  const c = els.content;
  c.innerHTML = "";

  c.append(el("div", "q-label", `${SECTIONS[sec].label} · PREGUNTA ${q.number}`));
  c.append(el("div", "q-ref", q.reference));

  if (sec === "multipleChoice") {
    c.append(el("p", "q-text", q.question));
    const ul = el("ul", "options");
    q.options.forEach((opt, i) => {
      const li = el("li");
      li.append(el("span", "letter", LETTERS[i]));
      li.append(el("span", "opt-text", opt));
      ul.append(li);
    });
    c.append(ul);
  } else if (sec === "fillBlank") {
    const p = el("p", "q-text phrase");
    const parts = q.phrase.split("___");
    parts.forEach((part, i) => {
      p.append(document.createTextNode(part));
      if (i < parts.length - 1) {
        const b = el("span", "blank");
        b.setAttribute("aria-label", "espacio en blanco");
        p.append(b);
      }
    });
    c.append(p);
  } else {
    c.append(el("p", "q-text analysis", q.question));
  }

  c.classList.remove("enter");
  void c.offsetWidth;            // reinicia la animación
  c.classList.add("enter");
  fit();
}

function renderAll() {
  document.body.dataset.section = state.section;
  renderSections();
  renderGrid();
  renderQuestion();
}

/* ------------------------------------------------------------
   Ajuste automático del tamaño de letra: parte de un tamaño base
   proporcional al escenario (≈66 px a 1920×1080) y lo reduce
   hasta que todo el contenido cabe sin desplazamiento.
   ------------------------------------------------------------ */
function fit() {
  const stage = els.stage, c = els.content;
  const cs = getComputedStyle(stage);
  const availW = stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const availH = stage.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  if (availW <= 0 || availH <= 0) return;

  const base = Math.max(14, Math.min(availW / 26, availH / 14.8));
  let scale = 1;
  c.style.fontSize = base + "px";
  while (scale > 0.35 && (c.scrollHeight > availH || c.scrollWidth > availW + 1)) {
    scale -= 0.03;
    c.style.fontSize = (base * scale) + "px";
  }
}

/* ============================================================
   ACCIONES
   ============================================================ */
function setSection(k) {
  if (!SECTIONS[k] || k === state.section) return;
  state.section = k;
  save();
  renderAll();
}

function go(i) {
  const n = list().length;
  if (i < 0 || i >= n) return;            // la navegación no sale de la sección
  state.index[state.section] = i;
  save();
  renderGrid();
  renderQuestion();
}
const next = () => go(state.index[state.section] + 1);
const prev = () => go(state.index[state.section] - 1);
const goNumber = num => {
  const i = list().findIndex(q => q.number === num);
  if (i >= 0) go(i);
};

function randomQuestion() {
  const sec = state.section;
  const cur = state.index[sec];
  const all = list().map((q, i) => i).filter(i => i !== cur);
  const unused = all.filter(i => !isUsed(sec, list()[i].number));
  const pool = unused.length ? unused : all;   // prioriza las no usadas
  if (!pool.length) return;
  go(pool[Math.floor(Math.random() * pool.length)]);
}

function toggleUsed(num) {
  const sec = state.section;
  const arr = state.used[sec];
  const at = arr.indexOf(num);
  if (at >= 0) arr.splice(at, 1); else arr.push(num);
  save();
  renderSections();
  renderGrid();
}

function resetProgress() {
  if (!confirm("¿Reiniciar el progreso?\n\nSe desmarcarán todas las preguntas usadas en las tres secciones.")) return;
  for (const k of SECTION_KEYS) { state.used[k] = []; state.index[k] = 0; }
  save();
  renderAll();
}

function setPresenting(on) {
  state.presenting = on;
  document.body.classList.toggle("presenting", on);
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  requestAnimationFrame(fit);
}

/* Pantalla completa (opcional; el modo presentación funciona sin ella) */
function isFullscreen() {
  return !!(document.fullscreenElement || document.webkitFullscreenElement);
}
function toggleFullscreen() {
  try {
    if (isFullscreen()) {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    } else {
      const r = document.documentElement;
      const req = r.requestFullscreen || r.webkitRequestFullscreen;
      if (req) {
        const p = req.call(r);
        if (p && p.catch) p.catch(() => {});
      }
    }
  } catch (e) { /* el navegador no lo permite: se ignora */ }
}
document.addEventListener("fullscreenchange", () => requestAnimationFrame(fit));
document.addEventListener("webkitfullscreenchange", () => requestAnimationFrame(fit));

/* ============================================================
   EVENTOS
   ============================================================ */
$("btnPresent").addEventListener("click", () => setPresenting(true));
$("btnRandom").addEventListener("click", randomQuestion);
$("btnPrev").addEventListener("click", prev);
$("btnNext").addEventListener("click", next);
$("btnUsed").addEventListener("click", () => toggleUsed(current().number));
$("btnReset").addEventListener("click", resetProgress);
$("btnFullscreen").addEventListener("click", toggleFullscreen);
$("pPrev").addEventListener("click", prev);
$("pNext").addEventListener("click", next);
$("pFull").addEventListener("click", toggleFullscreen);
$("pExit").addEventListener("click", () => setPresenting(false));

/* Selección por número: 1–9 inmediato salvo 1 y 2, que esperan un
   segundo dígito (10–24) durante un instante. */
let digitBuf = "", digitTimer = null;
function showDigitHint(t) {
  els.digitHint.textContent = t;
  els.digitHint.classList.toggle("show", !!t);
}
function commitDigits() {
  clearTimeout(digitTimer);
  const n = parseInt(digitBuf, 10);
  digitBuf = "";
  showDigitHint("");
  if (n >= 1 && n <= list().length) goNumber(n);
}
function onDigit(d) {
  clearTimeout(digitTimer);
  if (digitBuf === "") {
    if (d === 0) return;
    digitBuf = String(d);
    if (d * 10 > list().length) { commitDigits(); return; }
    showDigitHint(`Pregunta ${digitBuf}…`);
    digitTimer = setTimeout(commitDigits, 800);
  } else {
    const n = parseInt(digitBuf + d, 10);
    if (n <= list().length) { digitBuf += d; commitDigits(); }
    else { commitDigits(); onDigit(d); }
  }
}

document.addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key;

  if (/^[0-9]$/.test(k)) { e.preventDefault(); onDigit(parseInt(k, 10)); return; }

  switch (k) {
    case "ArrowRight": case "PageDown":
      e.preventDefault(); next(); break;
    case "ArrowLeft": case "PageUp":
      e.preventDefault(); prev(); break;
    case "Escape":
      if (state.presenting) { e.preventDefault(); setPresenting(false); }
      break;
    case "s": case "S":
      e.preventDefault(); setPresenting(false); break;
    case "f": case "F":
      e.preventDefault(); toggleFullscreen(); break;
    case "p": case "P":
      e.preventDefault(); setPresenting(!state.presenting); break;
    case "Enter":
      if (e.target && e.target.tagName === "BUTTON") return;   // deja que el botón haga clic
      e.preventDefault(); setPresenting(true); break;
    case "r": case "R":
      e.preventDefault(); randomQuestion(); break;
    case "u": case "U":
      e.preventDefault(); toggleUsed(current().number); break;
  }
});

/* Oculta el cursor en presentación tras 2 s sin mover el ratón */
let mouseTimer = null;
document.addEventListener("mousemove", () => {
  document.body.classList.add("mouse-active");
  document.body.classList.remove("hide-cursor");
  clearTimeout(mouseTimer);
  mouseTimer = setTimeout(() => {
    document.body.classList.remove("mouse-active");
    if (state.presenting) document.body.classList.add("hide-cursor");
  }, 2000);
});

window.addEventListener("resize", () => requestAnimationFrame(fit));
if (window.ResizeObserver) new ResizeObserver(() => fit()).observe(els.stage);

/* ============================================================
   INICIO
   ============================================================ */
load();
renderAll();
</script>
